name: Jarvis App (Windows)

# Gera o instalador do aplicativo Jarvis para Windows e publica na release
# "app-latest". Roda sozinho quando a interface muda, ou manualmente em
# Actions > Jarvis App (Windows) > Run workflow.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'launcher/icon.png'
      - '.github/workflows/jarvis-app.yml'

concurrency:
  group: jarvis-app
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências da interface
        working-directory: frontend
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: 'frontend/src-tauri -> target'

      - name: Ícone do Jarvis
        working-directory: frontend
        run: npx tauri icon ../launcher/icon.png

      - name: Gerar instalador
        working-directory: frontend
        run: npx tauri build --bundles nsis

      - name: Separar instalador
        shell: bash
        run: |
          mkdir out
          cp frontend/src-tauri/target/release/bundle/nsis/*.exe out/Jarvis-Instalador.exe
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Instalador
          path: out/Jarvis-Instalador.exe

      - name: Publicar na release app-latest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete app-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create app-latest out/Jarvis-Instalador.exe --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Jarvis para Windows" \
            --notes "Instalador do aplicativo Jarvis. Baixe Jarvis-Instalador.exe e abra."
